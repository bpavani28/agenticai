[project]
name = "pavani-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "notebook>=7.6.3",
    "openai>=3.22.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pavani-agents = "pavani_agents:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
